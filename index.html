  :root {
    --cream: #f7f0e8;
    --rose: #e8b4b8;
    --rose-deep: #b8797f;
    --rose-hover: #dda6ab;
    --plum: #5d4a6a;
    --muted: #a2938c;
    --faint: #bdb0a6;
    --white: #fffbf7;
    --line: #e5d9cc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--cream);
    font-family: Quicksand, system-ui, sans-serif;
  }
  a { color: var(--rose-deep); text-decoration: none; }
  a:hover { color: #8f5f63; }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 44px 56px;
  }

  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  /* El icono de verdad de la app, el mismo que se verá en la App Store. */
  .mark { width: 44px; height: 44px; border-radius: 12px; display: block; }
  .tagline { font: 600 15px Quicksand, sans-serif; color: var(--muted); }
  .nav-link { font: 600 15px Quicksand, sans-serif; color: var(--plum); }
  .nav-link:hover { color: var(--rose-deep); }

  main {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 52px; padding: 80px 0; text-align: center;
  }
  /* Snell Roundhand es la que usa la app en la bienvenida y viene en iOS y macOS;
     Great Vibes es su equivalente para el resto de sistemas. */
  .wordmark {
    margin: 0;
    font-family: "Snell Roundhand", "Great Vibes", cursive;
    font-weight: 700;
    font-size: clamp(64px, 12vw, 148px);
    line-height: 1.1;
    color: var(--rose-deep);
    /* Las letras de trazo manual se salen por abajo: sitio para las colas. */
    padding-bottom: .12em;
  }
  h1 {
    margin: 0; max-width: 15ch;
    font: 700 clamp(40px, 7.4vw, 116px)/.98 Quicksand, sans-serif;
    letter-spacing: -.035em; color: var(--plum); text-wrap: balance;
  }
  .lead {
    margin: 0; max-width: 44ch;
    font: 500 clamp(17px, 1.5vw, 22px)/1.6 Quicksand, sans-serif;
    color: var(--muted); text-wrap: pretty;
  }

  .cta {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 7px 7px 22px; border-radius: 999px;
    background: var(--white); border: 1px solid var(--line);
  }
  .cta-input {
    flex: 1; min-width: 0; border: 0; background: transparent; outline: none;
    font: 500 16px Quicksand, sans-serif; color: var(--plum);
  }
  .cta-input::placeholder { color: var(--faint); }
  .cta button { border: 0; cursor: pointer; font-family: Quicksand, sans-serif; }
  .hp { position: absolute; left: -9999px; opacity: 0; }
  .join-msg {
    margin: -34px 0 0; min-height: 22px;
    font: 500 15px Quicksand, sans-serif; color: var(--rose-deep);
  }
  .cta-button {
    padding: 14px 26px; border-radius: 999px; background: var(--rose);
    font: 700 16px Quicksand, sans-serif; color: var(--white);
    transition: background .18s ease;
  }
  .cta-button:hover { background: var(--rose-hover); color: var(--white); }

  footer {
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
    font: 500 13px "DM Mono", monospace; color: var(--faint);
  }
  footer nav { display: flex; gap: 22px; flex-wrap: wrap; }
  footer a { color: var(--faint); }
  footer a:hover { color: var(--rose-deep); }

  @media (max-width: 640px) {
    .page { padding: 24px 20px; }
    main { gap: 34px; padding: 48px 0; }
    .tagline { display: none; }
    .cta { flex-direction: column; align-items: stretch; gap: 12px; padding: 16px; border-radius: 28px; }
    .cta-hint { text-align: center; }
    .cta-button { text-align: center; }
    footer { flex-direction: column; gap: 14px; text-align: center; }
  }
</style>

<body>

<div class="page">

  <header>
    <div class="brand">
      <img class="mark" src="icon.png" width="44" height="44" alt="KipLook">
      <span class="tagline">the outfit calendar</span>
    </div>
    <a class="nav-link" href="#join">Join the waitlist</a>
  </header>

  <main>
    <p class="wordmark">KipLook</p>

    <h1>Your closet has a memory now.</h1>

    <p class="lead">One photo a day. A year of outfits you can actually look back on — even the days you stayed in.</p>

    <form id="join" class="cta" action="https://api.web3forms.com/submit" method="POST">
      <input type="hidden" name="access_key" value="REEMPLAZA-CON-TU-CLAVE">
      <input type="hidden" name="subject" value="Nuevo apuntado a la lista de KipLook">
      <input type="hidden" name="from_name" value="Lista de espera KipLook">
      <!-- Trampa para bots: una persona nunca la rellena porque no la ve. -->
      <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off">

      <input class="cta-input" type="email" name="email" required
             placeholder="your@email.com" aria-label="Your email">
      <button class="cta-button" type="submit">Get early access</button>
    </form>

    <p id="join-msg" class="join-msg" role="status" aria-live="polite"></p>
  </main>

  <footer>
    <span>KipLook · 2026</span>
    <nav>
      <a href="https://instagram.com/kiplook" target="_blank" rel="noopener">Instagram</a>
      <a href="mailto:hola@kiplook.com">Contact</a>
      <a href="privacy.html">Privacy</a>
      <a href="support.html">Support</a>
    </nav>
  </footer>

</div>

<script>
(function () {
  var form = document.getElementById('join');
  var msg = document.getElementById('join-msg');
  var key = form.querySelector('[name=access_key]').value;

  form.addEventListener('submit', function (event) {
    // Sin clave configurada, en vez de dar un error al visitante, se abre su correo.
    if (key.indexOf('REEMPLAZA') === 0) {
      event.preventDefault();
      window.location.href = 'mailto:hola@kiplook.com?subject=Early access to KipLook';
      return;
    }

    event.preventDefault();
    var button = form.querySelector('button');
    button.disabled = true;
    msg.textContent = 'Sending…';

    fetch(form.action, { method: 'POST', body: new FormData(form) })
      .then(function (response) { return response.json(); })
      .then(function (data) {
        if (data.success) {
          form.style.display = 'none';
          msg.textContent = "You're on the list. We'll be in touch.";
        } else {
          throw new Error(data.message || 'failed');
        }
      })
      .catch(function () {
        button.disabled = false;
        msg.textContent = "Couldn't send it. Write to hola@kiplook.com instead.";
      });
  });
})();
</script>
</body>
